<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarimoko Careers | Domestic Partnership Application</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #090a0f;
            --panel-bg: rgba(17, 19, 28, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #6366f1;
            --accent-gradient: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 4rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Better scrolling for long forms */
        }

        .portal-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            max-width: 650px;
            width: 100%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 4rem;
        }

        /* Job Posting Header */
        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        
        .logo span { color: var(--accent-color); }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
        }

        .meta-tags {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .meta-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .meta-badge i {
            margin-right: 0.35rem;
            color: var(--accent-color);
        }

        /* Form Layout Elements */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin: 2.5rem 0 1.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            padding-bottom: 0.5rem;
        }

        .section-title i {
            color: #818cf8;
        }

        .form-group {
            margin-bottom: 1.75rem;
            display: block; /* Force layout separation */
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
            display: block;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Layout Grid for Columns */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        @media(max-width: 550px) {
            .options-grid { grid-template-columns: 1fr; }
            .portal-wrapper { padding: 1.5rem; }
        }

        /* Native-Aligned Selection Inputs to Prevent Collapsing */
        .selection-control {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            gap: 0.75rem;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .selection-control:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .selection-control input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Form Actions Button */
        .submit-btn {
            width: 100%;
            background: var(--text-main);
            color: var(--bg-base);
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 2.5rem;
            font-family: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:active { transform: scale(0.99); }
    </style>
</head>
<body>

    <div class="portal-wrapper">
        
        <div class="header">
            <div class="logo">sarimoko<span>.</span> holdings</div>
            <h1>Wife / Long-Term Partner</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Department of Domestic Operations & Strategic Sanity</p>
            
            <div class="meta-tags">
                <div class="meta-badge"><i class="fa-solid fa-briefcase"></i> Full-Time / Permanent</div>
                <div class="meta-badge"><i class="fa-solid fa-location-dot"></i> Co-habitation Required</div>
                <div class="meta-badge"><i class="fa-solid fa-bolt"></i> Fast-Paced Environment</div>
            </div>
        </div>

        <form action="https://formspree.io/f/mnjravlz" method="POST">
            
            <input type="hidden" name="_replyto" value="travis@sarimoko.com">
            <input type="hidden" name="_subject" value="🚨 Urgent Application: Domestic Partner Position">

            <div class="section-title"><i class="fa-solid fa-user-tie"></i> Phase 1: Candidate Baseline</div>
            
            <div class="form-group">
                <label for="name">Legal Applicant Name</label>
                <input type="text" id="name" name="Applicant Name" placeholder="Jane Doe" required>
            </div>

            <div class="options-grid">
                <div class="form-group">
                    <label for="temp">Ideal Thermostat Temp (°F)</label>
                    <select id="temp" name="Thermostat Parameter" required>
                        <option value="68">68° (Correct Answer)</option>
                        <option value="72">72° (Slightly Sub-optimal)</option>
                        <option value="75+">75°+ (Dealbreaker / Extreme Risk)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="hobbies">Primary Gaming Tolerance</label>
                    <select id="hobbies" name="Gaming Protocol" required>
                        <option value="high">Encourages it / Brings snacks</option>
                        <option value="medium">Quietly co-exists with headphones</option>
                        <option value="low">Heavy eye-rolls (Performance review required)</option>
                    </select>
                </div>
            </div>

            <div class="section-title"><i class="fa-solid fa-scale-balanced"></i> Phase 2: Crisis Resolution Metrics</div>

            <div class="form-group">
                <label>Where should we eat tonight?</label>
                <div class="options-grid">
                    <label class="selection-control">
                        <input type="radio" name="Dinner Conflict Logic" value="Indecisive standard" required>
                        <span>"I don't care, you pick."</span>
                    </label>
                    <label class="selection-control">
                        <input type="radio" name="Dinner Conflict Logic" value="Constructive asset">
                        <span>An actual food suggestion</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Spontaneous Delivery Package Protocol:</label>
                <div class="options-grid">
                    <label class="selection-control">
                        <input type="checkbox" name="Package Acceptance Core" value="Tech Approved">
                        <span>I accept unannounced tech gear</span>
                    </label>
                    <label class="selection-control">
                        <input type="checkbox" name="Package Acceptance Core" value="Mutual Amnesty Allowed">
                        <span>I maintain package amnesty</span>
                    </label>
                </div>
            </div>

            <div class="section-title"><i class="fa-solid fa-terminal"></i> Phase 3: Qualitative Open Response</div>

            <div class="form-group">
                <label for="statement">Why are you uniquely qualified to handle Travis's server setups, code experiments, and layout habits?</label>
                <textarea id="statement" name="Personal Statement Matrix" rows="4" placeholder="Detail your previous experience handling chaotic tech operations..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                File Official Application <i class="fa-solid fa-paper-plane"></i>
            </button>

        </form>

    </div>

</body>
</html>
